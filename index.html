<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Chemist Sales Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light dark}
[hidden]{display:none!important}

/* Layout: sticky tab bar over one working area. Overview = summary first; Sell = picker + cart; Stock/Log/Cash book = tables. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eaeef2; --ink:#14202b; --ink-2:#4c5a67; --ink-3:#6f7d8a;
  --line:#d8dfe6; --accent:#2a6fd1; --accent-ink:#ffffff; --accent-soft:#e3eefc;
  --ok:#1f7a3d; --ok-bg:#e0f2e6; --low:#8a5200; --low-bg:#fbeacc; --out:#b3261e; --out-bg:#fbe1df;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e3e8ed;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --surface-2:#1f2b37; --ink:#e8edf2; --ink-2:#b4c0cb; --ink-3:#8b99a6;
  --line:#2c3a47; --accent:#5a9bf0; --accent-ink:#0b1722; --accent-soft:#1b2e47;
  --ok:#6fcf8d; --ok-bg:#16301f; --low:#f0b45a; --low-bg:#3a2a10; --out:#ff8b83; --out-bg:#3d1b19;
  --s1:#3987e5; --s2:#d95926; --grid:#26323e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --surface-2:#1f2b37; --ink:#e8edf2; --ink-2:#b4c0cb; --ink-3:#8b99a6;
  --line:#2c3a47; --accent:#5a9bf0; --accent-ink:#0b1722; --accent-soft:#1b2e47;
  --ok:#6fcf8d; --ok-bg:#16301f; --low:#f0b45a; --low-bg:#3a2a10; --out:#ff8b83; --out-bg:#3d1b19;
  --s1:#3987e5; --s2:#d95926; --grid:#26323e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1080px;margin:0 auto}
header{padding:18px 0 10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--ink-3);font-size:12.5px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding:6px 0}
nav a{padding:8px 14px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-size:14px;margin:0 0 10px;font-weight:600}
.panel h2 small{font-weight:400;color:var(--ink-3);margin-left:6px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--ink-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:right}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn.danger{color:var(--out)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
input[type=number]{font-family:var(--mono)}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);font-weight:500}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:end}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.low{background:var(--low-bg);color:var(--low)} .pill.out{background:var(--out-bg);color:var(--out)} .pill.ex{background:var(--surface-2);color:var(--ink-2)}
.bar{height:8px;border-radius:4px;background:var(--s1);min-width:2px}
.row{display:grid;grid-template-columns:minmax(80px,1.2fr) 3fr auto;gap:10px;align-items:center;padding:4px 0}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--ink-3);padding:14px;border:1px dashed var(--line);border-radius:6px;text-align:center}
.banner{background:var(--low-bg);color:var(--low);padding:10px 12px;border-radius:6px;font-weight:500}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:3;white-space:nowrap}
.tip b{font-family:var(--mono)}
.sell{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
@media (max-width:760px){.sell{grid-template-columns:minmax(0,1fr)}}
.picker{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;margin-top:8px}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;padding:8px 10px}
.pick small{color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-weight:600;border:0;background:var(--surface);color:var(--ink-2);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.total{font-family:var(--mono);font-size:28px;font-weight:600}
.cartline{display:grid;grid-template-columns:minmax(0,1fr) 62px 78px auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.cartline .lt{font-family:var(--mono);text-align:right;min-width:70px}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:8px 0;border-bottom:2px solid var(--line);font-weight:600;margin-top:10px}
.sale{display:grid;grid-template-columns:54px minmax(0,1fr) auto auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.sale .t{font-family:var(--mono);color:var(--ink-3);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-weight:500;max-width:90vw}
.overlay{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:15;display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 16px;overflow:auto}
.overlay .panel{width:min(560px,100%)}
details summary{cursor:pointer;color:var(--ink-2);font-weight:500}
.muted{color:var(--ink-3)} .small{font-size:12px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
.auth .panel{width:min(380px,100%)}
.auth h1{margin-bottom:4px}
.err{color:var(--out);min-height:1.3em;margin:8px 0 0;font-weight:500}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="auth" class="auth" hidden>
  <div class="panel">
    <h1>Chemist Sales Panel</h1>
    <p class="sub" style="margin:0 0 14px">Moyale · sign in to continue</p>
    <form id="lg_form" class="form" style="grid-template-columns:1fr" autocomplete="on">
      <label>Email<input id="lg_email" type="email" value="waqodiid@gmail.com" autocomplete="username" required></label>
      <label>Password<input id="lg_pw" type="password" autocomplete="current-password" required></label>
      <button id="lg_btn" class="btn pri" type="submit">Sign in</button>
    </form>
    <p id="lg_err" class="err" role="alert"></p>
  </div>
</div>
<div class="wrap" id="app" hidden>
  <header><div><h1>Chemist Sales Panel</h1><div class="sub">Moyale · amounts in KES · cash and till tracked separately</div></div>
    <div class="top"><span class="sub" id="who"></span><button class="btn sm" id="btn_pw" type="button">Change password</button><button class="btn sm" id="btn_out" type="button">Sign out</button></div></header>
  <nav id="nav" aria-label="Sections">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#sell" data-tab="sell">Sell</a>
    <a href="#stock" data-tab="stock">Stock</a>
    <a href="#log" data-tab="log">Sales log</a>
    <a href="#cashbook" data-tab="cashbook">Day book</a>
  </nav>
  <main id="main"></main>
</div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var state={db:false,sb:null,stock:{},sales:[],book:{},restocks:[],loaded:{},tab:'overview',cart:[],pay:'cash',cashIn:'',search:'',logDays:10,err:'',editDay:null};
var TABS=['overview','sell','stock','log','cashbook'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
var WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Math.round(n||0).toLocaleString('en-US')}
function kfmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k':String(Math.round(n))}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function fd(s){var d=pd(s);return WD[(d.getDay()+6)%7]+' '+d.getDate()+' '+MON[d.getMonth()]}
function monLabel(ym){var p=ym.split('-');return MONFULL[+p[1]-1]+' '+p[0]}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3200)}
function nice(max,n){var raw=max/n||1,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,s=f<=1?1:f<=2?2:f<=5?5:10;return s*p}
function status(it){var q=it.qty||0;return q<=0?'out':q<=(it.reorder||0)?'low':'ok'}
function statusPill(it){var s=status(it);return '<span class="pill '+s+'">'+(s==='out'?'✕ Out':s==='low'?'▲ Low':'✓ In stock')+'</span>'}

/* ---------- data ---------- */
function dayMap(){
  var m={};
  function g(d){return m[d]||(m[d]={bc:0,bt:0,e:0,ic:0,it:0,n:0,note:'',inBook:false})}
  Object.keys(state.book).forEach(function(ym){var days=(state.book[ym]||{}).days||{};Object.keys(days).forEach(function(d){var x=days[d],r=g(d);r.bc+=x.c||0;r.bt+=x.t||0;r.e+=x.e||0;r.note=x.note||'';r.inBook=true})});
  state.sales.forEach(function(s){var r=g(s.date);r.ic+=s.cash||0;r.it+=s.till||0;r.n++});
  Object.keys(m).forEach(function(d){var r=m[d];r.c=r.bc+r.ic;r.t=r.bt+r.it;r.total=r.c+r.t});
  return m;
}
function monthAgg(dm){
  var out={};
  Object.keys(dm).forEach(function(d){var r=dm[d];if(r.total<=0)return;var ym=d.slice(0,7),o=out[ym]||(out[ym]={ym:ym,c:0,t:0,e:0,days:0,best:0,bestD:''});o.c+=r.c;o.t+=r.t;o.e+=r.e;o.days++;if(r.total>o.best){o.best=r.total;o.bestD=d}});
  return Object.keys(out).sort().map(function(k){var o=out[k];o.total=o.c+o.t;o.avg=o.total/o.days;return o});
}

/* ---------- shell & routing ---------- */
function setTab(){
  var h=(location.hash||'').replace('#','');state.tab=TABS.indexOf(h)>=0?h:'overview';
  document.querySelectorAll('#nav a').forEach(function(a){if(a.dataset.tab===state.tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  buildTab();
}
window.addEventListener('hashchange',setTab);
function buildTab(){
  var m=$('#main');
  var banner='';
  if(state.err)banner+='<div class="banner">'+esc(state.err)+'</div>';
  m.innerHTML='<div id="banner">'+banner+'</div><div id="tabbody"></div>';
  ({overview:buildOverview,sell:buildSell,stock:buildStock,log:buildLog,cashbook:buildBook})[state.tab]();
}
function refresh(){
  if(!$('#tabbody'))return;
  if(state.tab==='overview')buildOverview();
  else if(state.tab==='sell')renderSellDyn();
  else if(state.tab==='stock')renderStockDyn();
  else if(state.tab==='log')renderLogDyn();
  else renderBookDyn();
}

/* ---------- overview ---------- */
function buildOverview(){
  var dm=dayMap(),months=monthAgg(dm),today=ymd(new Date()),thisYm=today.slice(0,7);
  var tot=0,exp=0,days=0,best=null,cashT=0,tillT=0;
  months.forEach(function(m){tot+=m.total;exp+=m.e;days+=m.days;cashT+=m.c;tillT+=m.t;if(!best||m.total>best.total)best=m});
  var cur=months.filter(function(m){return m.ym===thisYm})[0];
  var td=dm[today];
  var low=Object.keys(state.stock).map(function(k){return state.stock[k]}).filter(function(i){return status(i)!=='ok'}).sort(function(a,b){return a.qty-b.qty});
  var h='';
  h+='<div class="kpis">'
   +'<div class="kpi"><div class="l">Today</div><div class="v">'+fmt(td?td.total:0)+'</div><div class="n">'+(td&&td.n?td.n+' sales recorded':'cash '+fmt(td?td.c:0)+' · till '+fmt(td?td.t:0))+'</div></div>'
   +'<div class="kpi"><div class="l">'+MONFULL[new Date().getMonth()]+'</div><div class="v">'+fmt(cur?cur.total:0)+'</div><div class="n">'+(cur?cur.days+' trading days · '+fmt(cur.avg)+'/day':'no sales yet')+'</div></div>'
   +'<div class="kpi"><div class="l">Total recorded</div><div class="v">'+fmt(tot)+'</div><div class="n">'+days+' days · cash '+fmt(cashT)+' · till '+fmt(tillT)+'</div></div>'
   +'<div class="kpi"><div class="l">Best month</div><div class="v">'+(best?MON[+best.ym.slice(5)-1]:'–')+'</div><div class="n">'+(best?'KES '+fmt(best.total)+' · '+fmt(best.avg)+'/day':'')+'</div></div>'
   +'</div>';
  h+='<div class="panel"><h2>Sales by month<small>cash and till</small></h2><div class="legend"><span><i style="background:var(--s1)"></i>Cash</span><span><i style="background:var(--s2)"></i>Till</span></div><div class="chart" id="mchart"></div></div>';
  h+='<div class="panel"><h2>Months ranked by sales<small>highest first</small></h2><div class="tw"><table><thead><tr><th>#</th><th>Month</th><th class="num">Total sales</th><th>&nbsp;</th><th class="num">Cash</th><th class="num">Till</th><th class="num">Days</th><th class="num">Avg / day</th><th class="num">Expenses</th></tr></thead><tbody>';
  var ranked=months.slice().sort(function(a,b){return b.total-a.total}),mx=ranked.length?ranked[0].total:1;
  ranked.forEach(function(m,i){var part=m.ym===thisYm?' <span class="pill ex">so far</span>':m.ym==='2026-03'?' <span class="pill ex">from 20th</span>':'';
    h+='<tr><td class="muted">'+(i+1)+'</td><td><b>'+monLabel(m.ym)+'</b>'+part+'</td><td class="num"><b>'+fmt(m.total)+'</b></td><td style="width:22%"><div class="bar" style="width:'+Math.max(2,m.total/mx*100)+'%"></div></td><td class="num">'+fmt(m.c)+'</td><td class="num">'+fmt(m.t)+'</td><td class="num">'+m.days+'</td><td class="num">'+fmt(m.avg)+'</td><td class="num">'+(m.e?fmt(m.e):'–')+'</td></tr>'});
  if(!ranked.length)h+='<tr><td colspan="9"><div class="empty">No sales loaded yet.</div></td></tr>';
  h+='</tbody></table></div><p class="small muted" style="margin:10px 0 0">Sales are cash plus till before expenses. Compare months by Avg / day, because March starts on the 20th and the current month is still running.</p></div>';
  h+='<div class="panel"><h2>Daily trend<small>each day and the 7-day average</small></h2><div class="legend"><span><i style="background:var(--ink-3)"></i>Daily total</span><span><i style="background:var(--s1)"></i>7-day average</span></div><div class="chart" id="lchart"></div></div>';
  h+='<div class="grid"><div class="panel"><h2>Average by weekday</h2><div id="wd"></div></div><div class="panel"><h2>Top sellers<small>last 30 days, item by item</small></h2><div id="top"></div></div></div>';
  h+='<div class="panel"><h2>Stock needing attention<small>'+low.length+' items</small></h2>'+(low.length?'<div class="tw"><table><tbody>'+low.slice(0,10).map(function(i){return '<tr><td>'+esc(i.name)+'</td><td class="num">'+i.qty+' '+esc(i.unit||'')+'</td><td>'+statusPill(i)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">'+(Object.keys(state.stock).length?'Everything is above its reorder level.':'Add your drugs on the Stock tab to see low-stock warnings here.')+'</div>')+'</div>';
  h+='<details class="panel"><summary>About the imported 2026 figures</summary><p class="small muted">Daily cash and till figures come from your CHEMIST FINANCIAL YEAR 2026 notes (20 March to 1 November). Sundays, closed days and blank days count as no sales. 3 to 6 April are not in the notes. 14 April and 15 April both show 565 cash and 60 till, so one of them may be a copy. 11 August has only a total of 355 with no cash/till split (counted as cash). 24 to 31 October: the weekly total in the notes (4,165) did not match the daily rows, so the daily rows were used. Daily totals are before expenses, which are listed separately.</p></details>';
  $('#tabbody').innerHTML=h;
  drawMonths(months);drawLine(dm);drawWeekday(dm);drawTop();
}
function tipShow(host,html,x,y){var t=host.querySelector('.tip');if(!t){t=document.createElement('div');t.className='tip';host.appendChild(t)}t.innerHTML=html;var w=host.clientWidth;t.style.left=Math.min(Math.max(0,x+12),w-t.offsetWidth)+'px';t.style.top=Math.max(0,y-8-t.offsetHeight)+'px'}
function tipHide(host){var t=host.querySelector('.tip');if(t)t.remove()}
function drawMonths(months){
  var host=$('#mchart');if(!host)return;
  if(!months.length){host.innerHTML='<div class="empty">No data yet.</div>';return}
  var W=640,H=250,L=40,R=6,T=22,B=26,max=0;months.forEach(function(m){max=Math.max(max,m.total)});
  var step=nice(max,4),top=Math.ceil(max/step)*step,pw=W-L-R,ph=H-T-B,bw=Math.min(52,pw/months.length*.62),best=months.reduce(function(a,m){return m.total>a.total?m:a},months[0]);
  function y(v){return T+ph-v/top*ph}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly sales, cash and till">';

function drawLine(dm){
  var host=$('#lchart');if(!host)return;
  var ds=Object.keys(dm).filter(function(d){return dm[d].total>0}).sort();
  if(ds.length<2){host.innerHTML='<div class="empty">The trend appears once there are at least two days of sales.</div>';return}
  var t0=pd(ds[0]).getTime(),t1=pd(ds[ds.length-1]).getTime(),DAY=864e5;
  var pts=ds.map(function(d){var t=pd(d).getTime(),sum=0,n=0;ds.forEach(function(e){var te=pd(e).getTime();if(te<=t&&te>t-7*DAY){sum+=dm[e].total;n++}});return {d:d,t:t,v:dm[d].total,a:sum/n}});
  var W=640,H=240,L=40,R=8,T=10,B=26,max=0;pts.forEach(function(p){max=Math.max(max,p.v)});
  var step=nice(max,4),top=Math.ceil(max/step)*step,pw=W-L-R,ph=H-T-B;
  function X(t){return L+(t-t0)/(t1-t0)*pw} function Y(v){return T+ph-v/top*ph}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily sales trend with 7-day average">';
  for(var v=0;v<=top;v+=step)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)"/><text x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+kfmt(v)+'</text>';
  var seen={};pts.forEach(function(p){var ym=p.d.slice(0,7);if(!seen[ym]){seen[ym]=1;var d=pd(ym+'-01').getTime();var x=Math.max(L,X(Math.max(d,t0)));s+='<text x="'+x+'" y="'+(H-8)+'">'+MON[+ym.slice(5)-1]+'</text>'}});
  s+='<polyline fill="none" stroke="var(--ink-3)" stroke-width="1" stroke-opacity=".7" stroke-linejoin="round" points="'+pts.map(function(p){return X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ')+'"/>';
  s+='<polyline fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return X(p.t).toFixed(1)+','+Y(p.a).toFixed(1)}).join(' ')+'"/>';
  var lp=pts[pts.length-1];s+='<circle cx="'+X(lp.t)+'" cy="'+Y(lp.a)+'" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>';
  s+='<g id="cx" hidden><line y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--ink-3)" stroke-dasharray="3 3"/><circle r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/></g>';
  s+='<rect id="lhit" x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'" fill="transparent"/></svg>';
  host.innerHTML=s;
  var hit=$('#lhit',host),cx=$('#cx',host);
  hit.addEventListener('pointermove',function(e){
    var svg=host.querySelector('svg'),r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W,t=t0+(sx-L)/pw*(t1-t0),bi=0,bd=1e18;
    pts.forEach(function(p,i){var dd=Math.abs(p.t-t);if(dd<bd){bd=dd;bi=i}});var p=pts[bi];
    cx.removeAttribute('hidden');cx.querySelector('line').setAttribute('x1',X(p.t));cx.querySelector('line').setAttribute('x2',X(p.t));var c=cx.querySelector('circle');c.setAttribute('cx',X(p.t));c.setAttribute('cy',Y(p.v));
    var hr=host.getBoundingClientRect();tipShow(host,'<b>'+fd(p.d)+'</b><br>Day <b>'+fmt(p.v)+'</b><br>7-day avg '+fmt(p.a),e.clientX-hr.left,e.clientY-hr.top);
  });
  hit.addEventListener('pointerleave',function(){cx.setAttribute('hidden','');tipHide(host)});
}

    var qty=Math.round(+p[1]||0),price=+p[2]||0,cost=+p[3]||0,re=p[4]===undefined||p[4]===''?10:Math.round(+p[4]||0),r;
    if(existing){r=await state.sb.from('drugs').update({sell_price:price||existing.price,buy_price:cost||existing.cost}).eq('id',existing.id);if(r.error)throw r.error;if(qty>0){r=await state.sb.from('stock_in').insert({drug_id:existing.id,qty:qty,total_cost:0});if(r.error)throw r.error}}
    else{r=await state.sb.from('drugs').insert({name:p[0],qty:qty,sell_price:price,buy_price:cost,reorder_level:re});if(r.error)throw r.error}
    n++}
    await reload();closeOv();toast(n+' drugs added or topped up')}catch(e){await reload().catch(function(){});toast(dbErr(e,'Could not save'))}
}
/* ---------- sales log ---------- */
function buildLog(){$('#tabbody').innerHTML='<div class="panel"><h2>Sales log<small>item by item, newest first</small></h2><div id="logbody"></div></div>';renderLogDyn()}
function renderLogDyn(){
  var host=$('#logbody');if(!host)return;var by={};state.sales.forEach(function(s){(by[s.date]||(by[s.date]=[])).push(s)});
  var ds=Object.keys(by).sort().reverse();
  if(!ds.length){host.innerHTML='<div class="empty">No itemised sales yet. Record a sale on the Sell tab and it will be listed here with the drugs, prices and how it was paid.</div>';return}
  var h='';ds.slice(0,state.logDays).forEach(function(d){var ss=by[d].sort(function(a,b){return b.ts-a.ts}),c=0,k=0;ss.forEach(function(s){c+=s.cash||0;k+=s.till||0});
    h+='<div class="dayhead"><span>'+fd(d)+'</span><span class="num">Total '+fmt(c+k)+' · cash '+fmt(c)+' · till '+fmt(k)+'</span></div>';
    ss.forEach(function(s){var t=new Date(s.ts),pay=s.cash&&s.till?'Split':s.till?'Till':'Cash';
      h+='<div class="sale"><span class="t">'+pad(t.getHours())+':'+pad(t.getMinutes())+'</span><span>'+(s.lines||[]).map(function(l){return esc(l.name)+' ×'+l.qty+' @'+fmt(l.price)}).join(', ')+'</span><span class="num"><b>'+fmt(s.total)+'</b> <span class="pill ex">'+pay+'</span></span><button class="btn sm danger" data-act="void" data-id="'+s.id+'">'+(state.confirmVoid===s.id?'Confirm: undo sale':'Undo')+'</button></div>'})});
  if(ds.length>state.logDays)h+='<div style="margin-top:12px"><button class="btn" data-act="morelog">Show earlier days</button></div>';
  host.innerHTML=h;
}
async function voidSale(id){
  if(state.confirmVoid!==id){state.confirmVoid=id;renderLogDyn();return}
  state.confirmVoid=null;
  try{var r=await state.sb.from('sales').delete().eq('id',id);if(r.error)throw r.error;await reload();toast('Sale undone and stock put back')}catch(e){toast(dbErr(e,'Could not undo'))}
}
/* ---------- day book ---------- */
function buildBook(){
  var d=state.editDay||{date:ymd(new Date()),c:'',t:'',e:'',note:''};
  $('#tabbody').innerHTML='<div class="panel"><h2>Record a day\'s totals<small>for days you did not enter item by item</small></h2><div class="form"><label>Date<input id="k_date" type="date" value="'+d.date+'"></label><label>Cash collected<input id="k_c" type="number" min="0" value="'+esc(d.c)+'"></label><label>Sent to till / account<input id="k_t" type="number" min="0" value="'+esc(d.t)+'"></label><label>Expenses<input id="k_e" type="number" min="0" value="'+esc(d.e)+'"></label><label>Note<input id="k_n" value="'+esc(d.note||'')+'" placeholder="optional"></label><button class="btn pri" data-act="savebook">Save day</button></div><p class="small muted" style="margin:10px 0 0">Do not enter totals for a day you recorded item by item on the Sell tab. Both would be added together.</p></div><div class="panel"><h2>Recent days</h2><div class="tw" id="booktbl"></div></div>';
  renderBookDyn();
}
function renderBookDyn(){
  var host=$('#booktbl');if(!host)return;var dm=dayMap(),ds=Object.keys(dm).sort().reverse().slice(0,45);
  host.innerHTML='<table><thead><tr><th>Date</th><th class="num">Cash</th><th class="num">Till</th><th class="num">Total</th><th class="num">Expenses</th><th>From</th><th>&nbsp;</th></tr></thead><tbody>'+ds.map(function(d){var r=dm[d],src=(r.n?'Sell tab':'')+(r.n&&r.inBook?' + ':'')+(r.inBook?'Day book':'');
    return '<tr><td>'+fd(d)+'</td><td class="num">'+fmt(r.c)+'</td><td class="num">'+fmt(r.t)+'</td><td class="num"><b>'+fmt(r.total)+'</b></td><td class="num">'+(r.e?fmt(r.e):'–')+'</td><td class="small muted">'+src+'</td><td style="white-space:nowrap">'+(r.inBook?'<button class="btn sm" data-act="editday" data-d="'+d+'">Edit</button> <button class="btn sm danger" data-act="delday" data-d="'+d+'">'+(state.confirmDay===d?'Confirm':'Delete')+'</button>':'')+'</td></tr>'}).join('')+'</tbody></table>'+(ds.length?'':'<div class="empty">No days recorded yet.</div>');
}
async function saveDay(){
  var date=$('#k_date').value;if(!date){toast('Pick a date');return}
  var row={day:date,cash:Math.max(0,Math.round(+$('#k_c').value||0)),till:Math.max(0,Math.round(+$('#k_t').value||0)),expenses:Math.max(0,Math.round(+$('#k_e').value||0)),note:$('#k_n').value.trim()||null};
  try{var r=await state.sb.from('daily_book').upsert(row,{onConflict:'day'});if(r.error)throw r.error;await reload();state.editDay=null;toast('Saved '+fd(date));buildBook()}catch(e){toast(dbErr(e,'Could not save'))}
}
async function delDay(d){
  if(state.confirmDay!==d){state.confirmDay=d;renderBookDyn();return}
  state.confirmDay=null;
  try{var r=await state.sb.from('daily_book').delete().eq('day',d);if(r.error)throw r.error;await reload();toast('Day removed')}catch(e){toast(dbErr(e,'Could not delete'))}
}
/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,id=b.dataset.id;
  if(a==='ovbg'){if(e.target===b)closeOv();return}
  if(a==='add')addToCart(id);
  else if(a==='addcustom'){var nm=state.search.trim();if(nm){state.cart.push({id:'',name:nm,qty:1,price:0,cost:0});state.search='';var q=$('#q');if(q)q.value='';renderSellDyn()}}
  else if(a==='rm'){state.cart.splice(+b.dataset.i,1);renderCart()}
  else if(a==='pay'){state.pay=b.dataset.p;renderCart()}
  else if(a==='clear'){state.cart=[];renderCart()}
  else if(a==='record')recordSale();
  else if(a==='newitem')itemForm();
  else if(a==='edititem')itemForm(id);
  else if(a==='saveitem')saveItem(id);
  else if(a==='delitem'){b.dataset.act='delitem2';b.textContent='Click again to delete'}
  else if(a==='delitem2'){state.sb.from('drugs').delete().eq('id',id).then(function(r){if(r.error){toast(dbErr(r.error,'Could not delete'))}else{reload().then(function(){closeOv();toast('Drug deleted')})}})}
  else if(a==='restock')restockForm(id);
  else if(a==='saverestock')saveRestock(id);
  else if(a==='bulk')bulkForm();
  else if(a==='savebulk')saveBulk();
  else if(a==='closeov')closeOv();
  else if(a==='void')voidSale(id);
  else if(a==='morelog'){state.logDays+=10;renderLogDyn()}
  else if(a==='savebook')saveDay();
  else if(a==='editday'){var dd=b.dataset.d,x=(state.book[dd.slice(0,7)]||{days:{}}).days[dd]||{};state.editDay={date:dd,c:x.c||'',t:x.t||'',e:x.e||'',note:x.note||''};buildBook();window.scrollTo(0,0)}
  else if(a==='delday')delDay(b.dataset.d);
});
document.addEventListener('change',function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;var i=+t.dataset.i,l=state.cart[i];if(!l)return;
  if(a==='qty'){var v=Math.max(1,Math.round(+t.value||1));if(l.id&&state.stock[l.id]&&v>state.stock[l.id].qty){v=state.stock[l.id].qty;toast('Only '+v+' in stock')}l.qty=v;renderCart()}
  else if(a==='price'){l.price=Math.max(0,+t.value||0);renderCart()}
});

function dbErr(e,prefix){var m=(e&&e.message)||'error';if(/check constraint/i.test(m))m='Not enough stock for one of the drugs.';else if(/duplicate key/i.test(m))m='That name already exists.';else if(/Failed to fetch|NetworkError/i.test(m))m='No internet connection.';return prefix+': '+m}
async function reload(){
  var sb=state.sb;
  var r=await Promise.all([
    sb.from('drugs').select('*'),
    sb.from('sales').select('*, sale_items(*)').order('sold_at',{ascending:false}).limit(3000),
    sb.from('daily_book').select('*').order('day'),
    sb.from('stock_in').select('*, drugs(name)').order('received_on',{ascending:false}).limit(30)
  ]);
  for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;
  var st={};r[0].data.forEach(function(d){st[d.id]={id:d.id,name:d.name,category:d.category||'',unit:d.unit||'',qty:+d.qty,price:+d.sell_price,cost:+d.buy_price,reorder:+d.reorder_level}});
  state.stock=st;
  state.sales=r[1].data.map(function(s){var ts=Date.parse(s.sold_at);return {id:s.id,ts:ts,date:s.sale_date,cash:+s.cash,till:+s.till,total:+s.cash+ +s.till,lines:(s.sale_items||[]).map(function(l){return {id:l.drug_id||'',name:l.drug_name,qty:+l.qty,price:+l.unit_price,cost:+l.unit_cost}})}});
  var bk={};r[2].data.forEach(function(d){var ym=d.day.slice(0,7);(bk[ym]||(bk[ym]={days:{}})).days[d.day]={c:+d.cash,t:+d.till,e:+d.expenses,note:d.note||''}});
  state.book=bk;
  state.restocks=r[3].data.map(function(x){return {date:x.received_on,name:(x.drugs&&x.drugs.name)||'',qty:+x.qty,cost:+x.total_cost}});
  refresh();
}
function showLogin(msg){$('#app').hidden=true;$('#auth').hidden=false;state.db=false;$('#lg_err').textContent=msg||''}
async function enter(session){
  $('#auth').hidden=true;$('#app').hidden=false;state.db=true;$('#who').textContent=session.user.email;
  setTab();
  try{await reload()}catch(e){state.err=dbErr(e,'Could not load data');var b=$('#banner');if(b)b.innerHTML='<div class="banner">'+esc(state.err)+'</div>'}
}

(async function(){
  if(!window.supabase){showLogin('Could not load the sign-in library. Check your internet and reload.');return}
